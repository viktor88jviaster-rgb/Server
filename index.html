<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Крипто-байк: заезд по свечам</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#1f2a40;--cyan:#5ee6f0;--gold:#ffc857;--green:#6df08a;--red:#ff5d6c;--txt:#d7deec;--mut:#7d8aa5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--txt);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:620px;margin:0 auto;pointer-events:none}
.card{background:rgba(18,24,38,.88);border:1px solid var(--line);border-radius:14px;padding:8px 6px 6px;text-align:center}
.card b{display:block;font-size:30px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.card span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.card small{display:block;font-size:11px;color:var(--gold);min-height:14px;font-weight:500}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 118px);text-align:center;font:500 13px "JetBrains Mono",monospace;color:var(--mut);pointer-events:none;animation:fade 1s ease 7s forwards}
@keyframes fade{to{opacity:0}}
#pad{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.grp{display:flex;gap:6px;pointer-events:auto}
.btn{width:64px;height:84px;border-radius:16px;border:1px solid #2a3550;background:rgba(30,38,58,.82);color:#cfd8ea;font:700 26px Rubik,sans-serif;touch-action:none;cursor:pointer;padding:0}
.btn.round{width:78px;height:78px;border-radius:50%;font-size:18px}
#rev{background:rgba(52,18,26,.88);border-color:#6b2a35;color:#ffd5d9}
#go{background:rgba(20,64,38,.9);border-color:#2f7a48;color:#d9ffe5}
.btn.on{filter:brightness(1.7);outline:2px solid var(--gold)}
#msg{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none;padding:20px}
#msg.show{display:flex}
#msg h1{margin:0;font-size:clamp(40px,11vw,76px);font-weight:700;letter-spacing:0}
#msg p{margin:0;font:500 16px "JetBrains Mono",monospace;color:var(--txt)}
#msg.bad{background:radial-gradient(circle,rgba(255,60,80,.28),rgba(11,15,23,.55))}
#msg.bad h1{color:var(--red)}
#msg.win{background:rgba(11,15,23,.7)}
#msg.win h1{color:var(--green)}
#again{pointer-events:auto;margin-top:8px;padding:14px 28px;border-radius:14px;border:1px solid #2f7a48;background:#143a23;color:#d9ffe5;font:700 18px Rubik,sans-serif;cursor:pointer;display:none}
#msg.win #again{display:block}
#play{pointer-events:auto;margin-top:12px;padding:18px 54px;border-radius:16px;border:1px solid #2f7a48;background:#1b5c37;color:#e8fff0;font:700 24px Rubik,sans-serif;cursor:pointer;display:none;box-shadow:0 0 28px rgba(80,220,130,.35)}
#msg.ready{background:rgba(11,15,23,.62)}
#msg.ready h1{color:var(--cyan)}
#msg.ready #play{display:block}

#hint{top:calc(env(safe-area-inset-top,0px) + 156px)}
#menuBtn{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 118px);padding:8px 14px;border-radius:12px;border:1px solid #2a3550;background:rgba(18,24,38,.88);color:#cfd8ea;font:500 14px Rubik,sans-serif;cursor:pointer;z-index:5}
#toMenu{pointer-events:auto;margin-top:2px;padding:10px 22px;border-radius:12px;border:1px solid #2a3550;background:rgba(18,24,38,.9);color:#cfd8ea;font:500 16px Rubik,sans-serif;cursor:pointer;display:none}
#msg.ready #toMenu,#msg.win #toMenu{display:block}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;background:#05070b;display:flex;justify-content:center;--acc:#ff2d4a;touch-action:manipulation}
#menu[hidden]{display:none}
#col{position:relative;width:min(100%,520px);height:100%;overflow:hidden}

#bg::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(5,7,11,.1) 0%,rgba(5,7,11,0) 38%,rgba(5,7,11,.7) 72%,#05070b 100%);transition:background .3s}
#menu.sub #bg{filter:blur(6px)}
#menu.sub #bg::after{background:rgba(5,7,11,.84)}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:flex-end;pointer-events:none;z-index:2}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(10,12,20,.7);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:15px;backdrop-filter:blur(6px)}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#e0a21a);box-shadow:0 0 8px rgba(255,200,87,.6)}
#view{position:absolute;left:0;right:0;top:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 58px) 16px 16px;display:flex;flex-direction:column;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:1}
.hero{margin-top:auto;text-align:center;padding-bottom:6px}
.ttl{font:700 clamp(40px,12vw,58px)/.95 Rubik,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 0 12px rgba(255,45,74,.9),0 0 38px rgba(255,45,74,.55)}
.hero .sub{margin:10px 0 18px;font:500 14px "JetBrains Mono",monospace;color:#c3cbe0;letter-spacing:.5px}
.big{width:100%;max-width:340px;padding:18px;border-radius:18px;border:1px solid #ff6a7e;background:linear-gradient(180deg,#ff3b57,#c8132f);color:#fff;font:700 24px Rubik,sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 0 32px rgba(255,45,74,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.big:active{transform:scale(.97)}
.big+.big{margin-top:12px}
.rec{margin-top:14px;color:#aeb8d0;font-size:14px}.rec b{color:var(--gold)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd h2{margin:0;font:700 24px Rubik,sans-serif}
.hd button{width:38px;height:38px;border-radius:12px;border:1px solid #2a3550;background:rgba(18,24,38,.8);color:#cfd8ea;font:700 22px Rubik,sans-serif;cursor:pointer;padding:0}
.pn{background:rgba(14,18,30,.78);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.pn h3{margin:0 0 6px;font:700 17px Rubik,sans-serif}
.pn p{margin:0 0 12px;color:#aab4cc;font-size:14px;line-height:1.4}
.row{display:flex;gap:8px}
.btn2{flex:1;padding:13px;border-radius:12px;border:1px solid #2a3550;background:rgba(30,38,58,.9);color:#e4eaf7;font:500 15px Rubik,sans-serif;cursor:pointer}
.btn2.hot{border-color:#ff6a7e;background:linear-gradient(180deg,#ff3b57,#c8132f);color:#fff;font-weight:700}
.btn2:disabled{opacity:.45;cursor:default}
.empty{text-align:center;color:#7d8aa5;font-size:14px;padding:18px 6px}
.q{display:flex;align-items:center;gap:12px}
.q .in{flex:1;min-width:0}.q .t{font-weight:500;font-size:15px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff3b57,#ffc857)}
.q small{color:#8f9bb8;font-size:12px}
.q .btn2{flex:none;padding:10px 14px;min-width:96px}
.rw{display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-weight:700;font-size:13px}
.rw .coin{width:12px;height:12px}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff3b57,#7a1022);font:700 36px Rubik,sans-serif;border:2px solid rgba(255,255,255,.25);overflow:hidden;box-shadow:0 0 24px rgba(255,45,74,.4)}
.av img{width:100%;height:100%;object-fit:cover}
.nm{text-align:center;font:700 22px Rubik,sans-serif}.un{text-align:center;color:#8f9bb8;font-size:14px;margin:2px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:rgba(14,18,30,.78);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font:700 24px Rubik,sans-serif;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:#8f9bb8}
#nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(8,10,16,.92);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);z-index:3}
#nav button{background:none;border:0;color:#7d8aa5;font:500 12px Rubik,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;cursor:pointer;border-radius:12px}
#nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.act{color:#ff4d67}
#nav button.act svg{filter:drop-shadow(0 0 6px rgba(255,45,74,.8))}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);background:#1b2234;border:1px solid #2a3550;color:#e4eaf7;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}

.ghost{margin-top:12px;width:100%;max-width:340px;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.28);background:rgba(10,12,20,.62);color:#e4eaf7;font:500 16px Rubik,sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
.ghost b{color:#ff6a7e;font-weight:700}
.ghost:active{transform:scale(.98)}
.vc{text-align:center}.vc.sel{border-color:#ff6a7e;box-shadow:0 0 22px rgba(255,45,74,.28)}
.vc canvas{width:100%;height:auto;display:block;border-radius:12px;background:rgba(255,255,255,.03)}
.vn{font:700 20px Rubik,sans-serif;margin:10px 0 8px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:12px;text-align:left}
.sr span{font-size:12px;color:#8f9bb8}
.sr i{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:4px;overflow:hidden}
.sr u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff3b57,#ffc857)}
.vc .btn2{width:100%;flex:none}

#rbar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 98px);height:8px;border-radius:99px;background:rgba(255,255,255,.14);z-index:4;pointer-events:none}
#rbar[hidden]{display:none}
#rbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;margin-left:-7px;border:2px solid #0b0f17}
#rbar i.me{background:#ffc857;width:18px;height:18px;top:-5px;margin-left:-9px;z-index:2;box-shadow:0 0 10px #ffc857}
#cd{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;font:700 clamp(90px,28vw,170px) Rubik,sans-serif;color:#fff;text-shadow:0 0 30px rgba(255,45,74,.9);pointer-events:none;z-index:6}
#cd.show{display:flex}
#srch,#res{position:fixed;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,11,.9);z-index:30;padding:20px}
#srch.show,#res.show{display:flex}
.sp{max-width:420px;width:100%;background:rgba(14,18,30,.96);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 18px;text-align:center}
.sp h2{margin:0 0 4px;font:700 24px Rubik,sans-serif}
.sp h2.w{color:var(--gold)}
.sp .cnt{color:var(--mut);font:500 14px "JetBrains Mono",monospace;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;text-align:left;font-weight:500}
.slot .dot{width:10px;height:10px;border-radius:50%;background:#6df08a;flex:none}
.slot.wait{color:#7d8aa5}.slot.wait .dot{background:#7d8aa5;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:#ff4d67;border-radius:50%;margin:0 auto 14px;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.rr{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:6px;text-align:left}
.rr b{width:22px;color:var(--gold)}.rr span{flex:1;font-weight:500}.rr em{font:500 14px "JetBrains Mono",monospace;font-style:normal}
.rr.me{background:rgba(255,45,74,.2);border:1px solid #ff6a7e}
.big.off{opacity:.5;box-shadow:none;filter:saturate(.6)}
.note{color:#8f9bb8;font-size:13px;line-height:1.45}

.gb{display:block;width:100%;max-width:240px;margin:10px auto 0;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.05);color:#fff;font:500 16px Rubik,sans-serif;letter-spacing:1.5px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
.gb:active{background:rgba(255,45,74,.28);border-color:#ff6a7e;transform:scale(.98)}
.lbtn{pointer-events:auto;color:#e4eaf7;cursor:pointer;font:700 14px Rubik,sans-serif}
.lbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#lmenu{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 56px);background:rgba(14,18,30,.97);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px;min-width:160px;pointer-events:auto;backdrop-filter:blur(10px)}
#lmenu[hidden]{display:none}
#lmenu button{display:flex;justify-content:space-between;width:100%;padding:11px 12px;border:0;background:none;color:#e4eaf7;font:500 15px Rubik,sans-serif;border-radius:10px;cursor:pointer}
#lmenu button.on{color:#ff6a7e;background:rgba(255,45,74,.12)}

.bal{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.bal b{display:flex;align-items:center;gap:7px;font-size:18px;color:#ffc857;font-variant-numeric:tabular-nums}
.leg{font-size:11px;color:#8f9bb8;margin:0 0 8px;line-height:1.5}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{background:rgba(14,18,30,.78);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;text-align:center;color:inherit;font:inherit;cursor:pointer;backdrop-filter:blur(8px)}
.gc.sel{border-color:#ff6a7e;box-shadow:0 0 16px rgba(255,45,74,.3)}
.gc:active{transform:scale(.98)}
.gc canvas{width:100%;height:auto;display:block;border-radius:10px;background:rgba(255,255,255,.03)}
.gn{font:700 13px Rubik,sans-serif;margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.mb{display:flex;align-items:center;gap:4px;font-size:10px}
.mb i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.mb u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff3b57,#ffc857)}
.uph{margin:16px 0 10px;font:700 17px Rubik,sans-serif}
.upsel{color:#6df08a;font-size:13px;min-height:16px;margin-top:-2px}
.up{padding:12px 14px}
.uh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.uh b{font:700 16px Rubik,sans-serif}.uh span{font-size:13px;color:#aab4cc}
.pips{display:flex;gap:6px;margin-bottom:10px}
.pips s{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);text-decoration:none}
.pips s.on{background:linear-gradient(90deg,#ff3b57,#ffc857);box-shadow:0 0 8px rgba(255,200,87,.4)}
.up .btn2{display:flex;justify-content:center;align-items:center;gap:6px}
.up .dn{flex:0 0 38%}
.up .coin{width:13px;height:13px}


#bst{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;border:1px solid #ffc857;background:rgba(18,24,38,.88);color:#ffc857;font:700 14px Rubik,sans-serif;z-index:5;pointer-events:none}
#bst[hidden]{display:none}
#bst.used{opacity:.45;border-color:#2a3550;color:#8f9bb8}
#bst svg{width:18px;height:18px}
.bc{display:flex;gap:12px;align-items:center}
.bc .ic{width:56px;height:56px;border-radius:14px;background:rgba(255,200,87,.12);display:flex;align-items:center;justify-content:center;color:#ffc857;flex:none}
.bc .ic svg{width:34px;height:34px}
.bc .in{flex:1;min-width:0}.bc .t{font:700 17px Rubik,sans-serif}
.bc small{display:block;color:#aab4cc;font-size:12.5px;line-height:1.4;margin:3px 0 8px}

const VEH={

};
function applyVehicle(id){
  const v=VEH[id]||VEH.classic;
  const lv=(typeof stats!=='undefined'&&stats&&stats.up&&stats.up[id])||[0,0,0,0];
  R=v.R;L=v.L;H=v.H;FWD=v.FWD;BRAKE=v.BRAKE;MU=v.MU;WHEELIE=v.WHEELIE;KICK=v.KICK;INERTIA=v.INERTIA;HF=v.HF;HU=v.HU;
  VMAX=v.VMAX*(1+.06*lv[0]);DRIVE=v.DRIVE*(1+.06*lv[1]);
  LEAN=v.LEAN*(1+.07*lv[2]);GL=v.GL*(1+.07*lv[2]);WMAX=v.WMAX*(1+.05*lv[2]);POP=v.POP*(1+.04*lv[3]);
}
let seed=1;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function gauss(){return(rnd()+rnd()+rnd()-1.5)*2}
let ys=[],cand=[],coins=[];
function sAt(x){const f=x/P-.5,i=Math.floor(f);if(i<0)return ys[0];if(i>=ys.length-1)return ys[ys.length-1];return ys[i]+(ys[i+1]-ys[i])*(f-i)}
function gen(s){
  seed=s;ys=[];cand=[];coins=[];
  let q=[],y=420,drift=0,left=0,vol=1,vleft=0;
  const doji=()=>({up:rnd()<.5,h:3,uw:3+rnd()*5,lw:3+rnd()*5});
  for(let i=0;i<PRE;i++){ys.push(y);cand.push(doji())}
  for(let i=0;i<N;i++){

function wheelContact(cx,cy){
  let best=null;
  const i0=Math.floor((cx-R)/P-.5),i1=Math.floor((cx+R)/P-.5),M=ys.length-1;
  for(let i=i0;i<=i1;i++){

    const ax=(i+.5)*P,ay=ys[ia],bx=(i+1.5)*P,by=ys[ib];
    const dx=bx-ax,dy=by-ay,m=Math.hypot(dx,dy);
    const snx=dy/m,sny=-dx/m;
    const tt=((cx-ax)*dx+(cy-ay)*dy)/(m*m);

    if(tt>0&&tt<1){nx=snx;ny=sny;pen=R-((cx-ax)*snx+(cy-ay)*sny)}
    else{
      const e=tt<=0?0:1,px=ax+dx*e,py=ay+dy*e;

function step(dt,inp,B){

    const s=wi?1:-1;
    const rx=s*L*ca-H*sa,ry=s*L*sa+H*ca;
    const c=wheelContact(B.x+rx,B.y+ry);
    if(!c)continue;
    g[wi]=true;
    const pen=Math.min(c.pen,18);
    const qx=rx-c.nx*R,qy=ry-c.ny*R;
    const wx=B.vx-B.w*qy,wy=B.vy+B.w*qx;

  const onG=g[0]||g[1];
  if(!onG){
    if(inp.l)B.w=Math.max(-WMAX,B.w-LEAN*dt);
    else if(inp.r)B.w=Math.min(WMAX,B.w+LEAN*dt);
    else if(inp.rev)B.w*=1-6*dt;

    if(inp.l)B.w-=GL*dt;

  }
  if(inp.go&&g[0]&&!(B.stab>0)){const f=Math.max(0,Math.min(1,(B.a+.9)/.4));B.w-=WHEELIE*f*dt}

function headHit(B){
  const ca=Math.cos(B.a),sa=Math.sin(B.a);

function draw(){
  const vw=W/S,vh=Hh/S;
  const tx=B.x-vw*.3+B.vx*.12;
  cam.x+=(tx-cam.x)*(1-Math.exp(-8/60));
  const ty=B.y-vh*.45;
  cam.y+=(ty-cam.y)*(1-Math.exp(-4/60));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0b0f17';ctx.fillRect(0,0,W,Hh);
  const safeTop=0;
  ctx.font='700 56px "JetBrains Mono",monospace';ctx.fillStyle='rgba(255,255,255,.05)';ctx.textAlign='left';ctx.fillText('LINKUSDT · 1m',-4,205+safeTop);
  ctx.setTransform(S*dpr,0,0,S*dpr,-cam.x*S*dpr,-cam.y*S*dpr);
  const x0=cam.x,x1=cam.x+vw,y0=cam.y,y1=cam.y+vh;
  ctx.lineWidth=1/S;ctx.strokeStyle='#151d2e';ctx.beginPath();
  for(let gy=Math.ceil(y0/80)*80;gy<y1;gy+=80){ctx.moveTo(x0,gy);ctx.lineTo(x1,gy)}
  const i0=Math.max(0,Math.floor(x0/P)-1),i1=Math.min(ys.length-1,Math.ceil(x1/P)+1);
  for(let i=i0-i0%10;i<=i1;i+=10){ctx.moveTo((i+.5)*P,y0);ctx.lineTo((i+.5)*P,y1)}
  ctx.stroke();
  for(let i=i0;i<=i1;i++){
    const c=cand[i],cx=(i+.5)*P,top=ys[i];
    ctx.fillStyle=ctx.strokeStyle=c.up?'#26a69a':'#ef5350';
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,top-c.uw);ctx.lineTo(cx,top+c.h+c.lw);ctx.stroke();
    ctx.fillRect(cx-CW/2,top,CW,c.h);
  }
  ctx.beginPath();ctx.moveTo(finishX,y0);ctx.lineTo(finishX,y1);ctx.setLineDash([10,8]);ctx.strokeStyle='#f2f4f8';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
  ctx.font='700 22px Rubik,sans-serif';ctx.fillStyle='#f2f4f8';ctx.textAlign='left';ctx.fillText(tr('lbl.finish'),finishX+10,sAt(finishX)-80);
  for(const c of coins){
    if(c.t||c.x<x0-20||c.x>x1+20)continue;
    const by=c.y+Math.sin(T*4+c.x*.1)*2;
    ctx.beginPath();ctx.arc(c.x,by,10,0,7);ctx.fillStyle='#ffc857';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#b8860b';ctx.stroke();
    ctx.fillStyle='#8a5a00';ctx.font='700 12px Rubik,sans-serif';ctx.textAlign='center';ctx.fillText('$',c.x,by+4.5);
  }
  if(mode==='race'){
    ctx.beginPath();ctx.moveTo(startX-28,y0);ctx.lineTo(startX-28,y1);ctx.setLineDash([10,8]);ctx.strokeStyle='#6df08a';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
    ctx.font='700 22px Rubik,sans-serif';ctx.fillStyle='#6df08a';ctx.textAlign='right';ctx.fillText(tr('lbl.start'),startX-36,sAt(startX)-80);
    for(const b of bots){
      if(online()){const px=b.x;b.x+=(b.tx-b.x)*.35;b.wr+=(b.x-px)/10;if(b.ty!=null&&b.y!=null){b.y+=(b.ty-b.y)*.35;b.a+=(b.ta-b.a)*.35}}
      if(b.x<x0-60||b.x>x1+60)continue;
      const v=VEH[b.veh],live=online()&&b.ty!=null&&b.y!=null,by=live?b.y:sAt(b.x)-v.R-v.H,sl=live?b.a/.9:Math.atan((sAt(b.x+8)-sAt(b.x-8))/16);
      ctx.save();ctx.globalAlpha=.6;ctx.translate(b.x,by);ctx.rotate(sl*.9);drawVehicle(ctx,b.veh,b.wr);ctx.restore();
      ctx.font='700 11px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillStyle=b.col;ctx.fillText(b.name,b.x,by-50);
    }
  }
  ctx.save();ctx.translate(B.x,B.y);ctx.rotate(B.a);drawVehicle(ctx,stats.veh,wr);ctx.restore();
  ctx.textAlign='center';
  if(state==='run'&&styleLive>=1){ctx.font='700 15px "JetBrains Mono",monospace';ctx.fillStyle='#ffc857';ctx.fillText(tr('live.style',{n:Math.round(styleLive)}),B.x,B.y-62)}
  for(const p of pops){ctx.globalAlpha=1-p.t/1.1;ctx.font='700 16px "JetBrains Mono",monospace';ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y-p.t*40)}
  ctx.globalAlpha=1;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='rgba(11,15,23,.92)';ctx.fillRect(W-66,0,66,Hh);
  ctx.font='500 12px "JetBrains Mono",monospace';ctx.textAlign='right';ctx.fillStyle='#9aa6bf';
  for(let gy=Math.ceil(y0/80)*80;gy<y1;gy+=80)ctx.fillText(price(gy),W-8,(gy-cam.y)*S+4);
  ctx.textAlign='center';ctx.fillStyle='#7d8aa5';
  for(let i=i0-i0%10;i<=i1;i+=10){if(i<0)continue;const sx=((i+.5)*P-cam.x)*S;if(sx>0&&sx<W-70)ctx.fillText(tl(i),sx,Hh-8)}

  $('hTrack').textContent=Math.max(0,Math.min(100,(B.x-startX)/(finishX-startX)*100)).toFixed(1)+'%';
  if(mode==='race'){
    $('hPts').textContent=(1+bots.filter(b=>b.x>B.x).length)+'/'+(bots.length+1);$('hFlips').textContent=raceT.toFixed(1);
    const bar=$('rbar').children,span=finishX-startX;
    for(let i=0;i<bots.length;i++)bar[i].style.left=Math.max(0,Math.min(100,(bots[i].x-startX)/span*100))+'%';
    bar[bots.length].style.left=Math.max(0,Math.min(100,(B.x-startX)/span*100))+'%';
  }else{$('hPts').textContent=points;$('hFlips').textContent=flips}
  const wheelie=B.g0&&!B.g1&&B.a<-.3;
  $('hSub').textContent=mode==='race'?'':wheelie?tr('sub.willie',{d:wheelDist.toFixed(1)}):lastStyle>0?tr('sub.style',{n:lastStyle}):'';
}

function startSearchOffline(n){
  hap();closeSearch();tmode=n;
  const names=[],used=new Set();
  while(names.length<n-1){const nm=(BNL[lang]||BNL.en)[(Math.random()*BNL.en.length)|0]+'_'+(10+((Math.random()*89)|0));if(!used.has(nm)){used.add(nm);names.push(nm)}}
  const s=srch={m:n,names,found:0,timer:0};
  $('srch').className='show';renderSearch();
  const next=()=>{
    if(srch!==s)return;
    if(s.found<n-1)s.timer=setTimeout(()=>{if(srch!==s)return;s.found++;renderSearch();hap();next()},800+Math.random()*1500);
    else s.timer=setTimeout(()=>{if(srch!==s)return;closeSearch();openRace(names)},1200);
  };
  next();
}

function startSearchOnline(n){
  hap();closeSearch();netClose();tmode=n;
  const s=srch={m:n,names:[],found:0,timer:0,online:true};
  $('srch').className='show';renderSearch();
  const fallback=()=>{if(srch!==s)return;netClose();closeSearch();toast(tr('toast.offline'));startSearchOffline(n)};
  let ws;
  try{ws=new WebSocket(SERVER_URL)}catch(_){fallback();return}
  const nt=net={ws,on:false,players:[],rows:{},names:{},you:null,sent:false,rewarded:false,finalRows:null};
  s.timer=setTimeout(fallback,7000);
  ws.onopen=()=>{try{ws.send(JSON.stringify({t:'find',mode:n,name:rawName(),veh:stats.veh,init:(TG&&TG.initData)||''}))}catch(_){}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(_){return}onNet(m,s,nt)};
  ws.onerror=()=>{if(srch===s&&!nt.on)fallback()};
  ws.onclose=()=>{if(srch===s&&!nt.on)fallback();else if(net===nt&&gameOn&&mode==='race'&&!nt.finalRows)toast(tr('toast.lost'))};

function onNet(m,s,nt){

    case 'q':if(srch===s){clearTimeout(s.timer);s.names=(m.others||[]).map(x=>esc(x));s.found=s.names.length;renderSearch()}break;
    case 'err':if(srch===s){netClose();closeSearch();toast(tr('toast.offline'));startSearchOffline(s.m)}break;
    case 'match':if(srch===s){nt.on=true;closeSearch();openRaceOnline(m,nt)}break;
    case 'st':for(const row of m.p){const b=bots.find(x=>x.id===row[0]);if(!b)continue;b.tx=row[1];if(row.length>2){b.ty=row[2];b.ta=row[3];if(b.y==null){b.y=b.ty;b.a=b.ta}}else b.ty=null}break;
    case 'fin':nt.rows[m.id]={time:m.time};if(m.id===nt.you)nt.myTime=m.time;if(state==='done')renderResOnline();break;
    case 'res':onResultOnline(m,nt);break;
  }
}
function openRaceOnline(m,nt){
  hap();applyVehicle(stats.veh);mode='race';N=RACE_N;$('bst').hidden=true;
  $('menu').hidden=true;$('game').hidden=false;gameOn=true;resize();
  trackSeed=m.seed;reset();coins=[];
  nt.players=m.players;nt.you=m.you;
  m.players.forEach(p=>{nt.names[p.id]=(p.bot?'🤖 ':'')+esc(p.name)});
  bots=m.players.filter(p=>p.id!==m.you).map((p,i)=>({id:p.id,name:nt.names[p.id],veh:VEH[p.veh]?p.veh:'classic',x:startX,y:null,a:0,tx:startX,ty:null,ta:0,v:0,fin:null,wr:0,col:BC[i%BC.length]}));
  netStart=Date.now()+(m.startAt-m.now);netT=0;
  raceT=0;state='countdown';cd=Math.max(0,(netStart-Date.now())/1000);
  $('lP').textContent=tr('hud.place');$('lF').textContent=tr('hud.time');
  $('rbar').innerHTML=bots.map(b=>'<i style="background:'+b.col+'"></i>').join('')+'<i class="me"></i>';$('rbar').hidden=false;
  $('msg').className='';$('res').className='';
  setHint(tr('hint.race'));
  try{TG.BackButton.show()}catch(_){}
}
const fmtMs=ms=>ms==null?'—':(ms/1000).toFixed(2)+' '+tr('r.sec');
function renderResOnline(){
  const nt=net;if(!nt)return;
  let rows;
  if(nt.finalRows)rows=nt.finalRows;
  else{
    const done=[],wait=[];
    for(const p of nt.players){
      const you=p.id===nt.you,t=you?(nt.myTime!=null?nt.myTime:(nt.myLocal!=null?Math.round(nt.myLocal*1000):null)):(nt.rows[p.id]?nt.rows[p.id].time:undefined);
      const row={id:p.id,name:you?myName():nt.names[p.id],time:t,you};
      (t===undefined||(you&&t==null)?wait:done).push(row);
    }
    done.sort((a,b)=>(a.time==null)-(b.time==null)||a.time-b.time);
    rows=done.concat(wait.map(w=>Object.assign(w,{time:'…'})));
  }
  $('rList').innerHTML=rows.map((x,i)=>'<div class="rr'+(x.you?' me':'')+'"><b>'+(i+1)+'</b><span>'+x.name+'</span><em>'+(x.time==='…'?'…':fmtMs(x.time))+'</em></div>').join('');
}
function onResultOnline(m,nt){
  nt.finalRows=m.rows.map(r=>({id:r.id,name:r.id===nt.you?myName():((r.bot?'🤖 ':'')+esc(r.name)),time:r.time,you:r.id===nt.you,place:r.place}));
  if(state!=='done'){state='done';$('msg').className='';$('cd').className=''}
  const me=nt.finalRows.find(x=>x.you),n=nt.finalRows.length,place=me?me.place:n;
  let rew=0;
  if(!nt.rewarded){
    nt.rewarded=true;
    if(me&&me.time!=null)rew=n===2?(place===1?50:0):([150,80,40,0,0][place-1]||0);
    stats.races++;if(place===1&&me&&me.time!=null)stats.wins++;stats.bonus+=rew;save();nt.rew=rew;
  }else rew=nt.rew||0;
  const valid=me&&me.time!=null;
  $('rTitle').textContent=valid?tr('r.p'+place):tr('r.dnf');$('rTitle').className=valid&&place===1?'w':'';
  $('rRew').textContent=rew?tr('r.reward',{n:rew}):tr('r.none');
  renderResOnline();$('res').className='show';
  try{TG.HapticFeedback.notificationOccurred(place===1?'success':'warning')}catch(_){}
}
function raceFinishOnline(){
  state='done';const nt=net;nt.myLocal=raceT;
  if(!nt.sent){nt.sent=true;try{nt.ws.send(JSON.stringify({t:'fin'}))}catch(_){}}
  $('msg').className='';
  if(!nt.finalRows){$('rTitle').textContent=tr('r.wait');$('rTitle').className='';$('rRew').textContent='';renderResOnline();$('res').className='show'}
}
$('sCancel').addEventListener('click',()=>{if(net&&!net.on){try{net.ws.send(JSON.stringify({t:'cancel'}))}catch(_){}netClose()}closeSearch()});
function openRace(names){
  hap();applyVehicle(stats.veh);mode='race';N=RACE_N;$('bst').hidden=true;
  $('menu').hidden=true;$('game').hidden=false;gameOn=true;resize();
  newTrack();reset();coins=[];
  const ids=Object.keys(VEH);
  bots=names.map((nm,i)=>{const vid=ids[(Math.random()*ids.length)|0];return{name:nm,veh:vid,x:startX,v:0,base:BASE[vid]+(Math.random()-.5)*60,ph:Math.random()*6,stall:0,fin:null,wr:0,col:BC[i%BC.length]}});
  raceT=0;state='countdown';cd=3;
  $('lP').textContent=tr('hud.place');$('lF').textContent=tr('hud.time');
  $('rbar').innerHTML=bots.map(b=>'<i style="background:'+b.col+'"></i>').join('')+'<i class="me"></i>';$('rbar').hidden=false;
  $('msg').className='';$('res').className='';
  setHint(tr('hint.race'));
  try{TG.BackButton.show()}catch(_){}
}
function raceTick(dt){
  raceT+=dt;
  if(online()){
    netT+=dt;
    if(netT>=.1){netT=0;if(net.ws.readyState===1)try{net.ws.send(JSON.stringify({t:'p',x:Math.round(B.x),y:Math.round(B.y),a:+B.a.toFixed(2)}))}catch(_){}}
    return;
  }
  for(const b of bots){
    if(b.fin!=null)continue;
    if(b.stall>0)b.stall-=dt;else if(Math.random()<dt*.045)b.stall=1+Math.random()*1.2;
    const sl=(sAt(b.x+10)-sAt(b.x-10))/20;
    let tv=b.base*(1+.16*Math.sin(raceT*.8+b.ph))*(1+Math.max(-.35,Math.min(.35,sl*.7)));
    if(b.stall>0)tv=40;
    b.v+=(tv-b.v)*Math.min(1,dt*2.5);
    b.x+=b.v*dt;b.wr+=b.v*dt/10;
    if(b.x>=finishX)b.fin=raceT;
  }
}
function flatScore(x){
  let lo=1e9,hi=-1e9,lo2=1e9,hi2=-1e9;
  for(let d=-(L+R+14);d<=L+R+14;d+=6){const y=sAt(x+d);if(y<lo)lo=y;if(y>hi)hi=y}
  for(let d=-110;d<=110;d+=10){const y=sAt(x+d);if(y<lo2)lo2=y;if(y>hi2)hi2=y}
  return (hi-lo)+.35*(hi2-lo2);
}
function respawn(){
  // ищем ровное место позади точки падения (не ближе 120 px, не дальше ~700 px)
  let bx=startX,bs=1e9;
  for(let k=0;k<24;k++){
    const x=Math.max(startX,Math.floor((B.x-120-k*P)/P)*P+P/2),sc=flatScore(x);
    if(sc<bs){bs=sc;bx=x}
    if(sc<=5)break;
    if(x<=startX)break;
  }
  B.x=bx;B.vx=B.vy=0;B.w=0;
  B.a=Math.atan2(sAt(bx+L)-sAt(bx-L),2*L);                 // по углу земли
  B.y=sAt(bx)-R-H-1;
  for(let i=0;i<80;i++){                                    // поднять, пока колёса не «в земле»
    let pen=0;const ca=Math.cos(B.a),sa=Math.sin(B.a);
    for(const sg of[-1,1]){const c=wheelContact(B.x+sg*L*ca-H*sa,B.y+sg*L*sa+H*ca);if(c&&c.pen>pen)pen=c.pen}
    if(pen<=.3)break;
    B.y-=Math.max(.5,pen);
  }
  B.g0=B.g1=true;B.gt=0;B.stab=1.3;inv=1.3;
  air=0;rot=0;wasAir=false;styleLive=0;state='run';$('msg').className='';
}
function raceFinish(){
  if(online()){raceFinishOnline();return}
  state='done';const my=raceT;
  const rows=[{name:myName(),t:my,you:true}].concat(bots.map(b=>({name:b.name,t:b.fin!=null?b.fin:my+(finishX-b.x)/Math.max(150,b.v)})));
  rows.sort((a,b)=>a.t-b.t);
  const place=rows.findIndex(x=>x.you)+1,n=rows.length;
  const rew=n===2?(place===1?50:0):([150,80,40,0,0][place-1]||0);
  stats.races++;if(place===1)stats.wins++;stats.bonus+=rew;save();
  $('rTitle').textContent=tr('r.p'+place);$('rTitle').className=place===1?'w':'';
  $('rList').innerHTML=rows.map((x,i)=>'<div class="rr'+(x.you?' me':'')+'"><b>'+(i+1)+'</b><span>'+x.name+'</span><em>'+x.t.toFixed(2)+' '+tr('r.sec')+'</em></div>').join('');
  $('rRew').textContent=rew?tr('r.reward',{n:rew}):tr('r.none');
  $('msg').className='';$('res').className='show';
  try{TG.HapticFeedback.notificationOccurred(place===1?'success':'warning')}catch(_){}
}
$('rAgain').addEventListener('click',()=>{const n=bots.length+1;backToMenu();startSearch(n)});
$('rMenu').addEventListener('click',backToMenu);
$('menuBtn').addEventListener('click',backToMenu);
$('toMenu').addEventListener('click',backToMenu);
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.t;go(tab===t?'home':t)}));
$('view').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='play')go('play');
  else if(a==='free')openGame();
  else if(a==='garage')go('garage');
  else if(a==='tourney')go('tourney');
  else if(a==='boosts')go('boosts');
  else if(a==='buyb')buyBoost(el.dataset.id);
  else if(a==='mode'){tmode=+el.dataset.m;hap();renderMenu()}
  else if(a==='search')startSearch(+el.dataset.m);
  else if(a==='bike'){const id=el.dataset.v;if(VEH[id]){gid=id;if(stats.veh!==id){stats.veh=id;save();toast(tr('toast.picked',{v:tr('v.'+id)}))}go('bike')}}
  else if(a==='backg')go('garage');
  else if(a==='backp')go('play');
  else if(a==='upg')upgrade(+el.dataset.i);
  else if(a==='dng')downgrade(+el.dataset.i);
  else if(a==='back')go('home');
  else if(a==='share'){
    const url='https://t.me/share/url?url='+encodeURIComponent(inviteLink())+'&text='+encodeURIComponent(tr('fr.share',{r:fmt(Math.max(best,stats.bestScore))}));
    try{if(TG&&TG.openTelegramLink)TG.openTelegramLink(url);else window.open(url,'_blank')}catch(_){window.open(url,'_blank')}
  }else if(a==='copy'){
    const done=()=>toast(tr('toast.copied'));
    try{navigator.clipboard.writeText(inviteLink()).then(done,()=>toast(inviteLink()))}catch(_){toast(inviteLink())}
  }else if(a==='claim'){
    const q=QUESTS.find(x=>x.id===el.dataset.id);
    if(q&&q.v()>=q.n&&!stats.claimed.includes(q.id)){stats.claimed.push(q.id);stats.bonus+=q.r;save();hap();toast(tr('toast.coins',{n:q.r}));renderMenu()}
  }
});

function initTG(){
  try{
    const t=window.Telegram&&Telegram.WebApp;if(!t||TG===t)return;
    TG=t;TU=t.initDataUnsafe&&t.initDataUnsafe.user||null;
    try{if(!localStorage.getItem('cb_lang')&&TU&&TU.language_code){lang=detectLang(TU.language_code);applyStatic()}}catch(_){}
    t.ready();t.expand();
    if(t.disableVerticalSwipes)t.disableVerticalSwipes();
    if(t.setHeaderColor)t.setHeaderColor('#0b0f17');
    if(t.setBackgroundColor)t.setBackgroundColor('#0b0f17');
    t.BackButton.onClick(backToMenu);
    renderMenu();
  }catch(_){}
}
try{
  if(window.Telegram&&Telegram.WebApp)initTG();
  else{const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';sc.async=true;sc.onload=initTG;document.head.appendChild(sc)}
}catch(_){}
if(stats.up.moped){const lv=stats.up.moped;let back=0;for(let i=0;i<4;i++)for(let l=0;l<(lv[i]|0);l++)back+=upCost('moped',l);stats.spent=Math.max(0,stats.spent-back);delete stats.up.moped;save()}
if(stats.veh==='moped')stats.veh='classic';
if(stats.veh==='moto')stats.veh='harley';if(!VEH[stats.veh])stats.veh='classic';applyVehicle(stats.veh);newTrack();reset();showReady(false);renderMenu();applyStatic();
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(gameOn){update(dt);draw()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
